<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yettel Bulgaria Dataset Viewer</title>
  <style>
    :root { color-scheme:dark; --bg:#0b0f16; --panel:#0e1420; --head:#101722; --line:#253044; --text:#e7ecf4; --muted:#9ba7b8; --purple:#563be6; --orange:#f5a524; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    main { width:min(1940px,calc(100% - 42px)); margin:40px auto; }
    .viewer { overflow:hidden; border:1px solid var(--line); border-radius:17px; background:var(--panel); box-shadow:0 0 0 2px rgba(37,48,68,.35),0 22px 60px rgba(0,0,0,.28); }
    .topbar { display:flex; align-items:center; gap:14px; min-height:80px; padding:16px 24px; border-bottom:1px solid var(--line); }
    .logo { display:grid; place-items:center; width:27px; height:27px; border:3px solid #e5e7eb; border-radius:5px; font:900 16px system-ui; }
    h1 { margin:0; font:750 25px/1.1 system-ui,sans-serif; letter-spacing:-.02em; }
    .spacer { flex:1; }
    .converted { color:var(--muted); font-family:system-ui,sans-serif; }
    .button { border:1px solid var(--line); border-radius:9px; padding:9px 13px; background:#121a27; color:var(--text); font:650 14px system-ui,sans-serif; text-decoration:none; cursor:pointer; }
    .button.purple { background:#241c5b; border-color:#332878; }
    .selectors { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line); }
    .selector { position:relative; padding:18px 24px; min-height:108px; font-family:system-ui,sans-serif; }
    .selector:first-child { border-right:1px solid var(--line); }
    .selector label { display:block; color:var(--muted); font-size:18px; margin-bottom:7px; }
    select { width:100%; appearance:none; border:0; outline:0; background:transparent; color:var(--text); font:650 19px ui-monospace,monospace; cursor:pointer; }
    .chevron { position:absolute; right:25px; bottom:27px; width:15px; height:15px; border-right:3px solid #e5e7eb; border-bottom:3px solid #e5e7eb; transform:rotate(45deg); pointer-events:none; }
    .search { display:flex; align-items:center; gap:14px; padding:18px 25px; border-bottom:1px solid var(--line); }
    .glass { width:20px; height:20px; border:2px solid var(--muted); border-radius:50%; position:relative; }
    .glass:after { content:""; position:absolute; width:9px; height:2px; background:var(--muted); right:-7px; bottom:-4px; transform:rotate(45deg); }
    input { width:100%; border:0; outline:0; background:transparent; color:var(--text); font:19px ui-monospace,monospace; }
    input::placeholder { color:var(--muted); }
    .table-wrap { overflow:auto; min-height:620px; }
    table { width:100%; min-width:1280px; border-collapse:separate; border-spacing:0; table-layout:fixed; }
    th,td { padding:16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th:last-child,td:last-child { border-right:0; }
    th { height:188px; background:var(--head); position:sticky; top:0; z-index:2; }
    th .name { display:block; font-size:18px; margin-bottom:2px; }
    th .dtype { color:var(--muted); font-weight:400; }
    th .dtype i { opacity:.8; }
    .hist { height:55px; display:flex; align-items:flex-end; gap:4px; margin-top:24px; }
    .hist i { display:block; width:26px; border-radius:4px 4px 0 0; background:#798396; opacity:.9; }
    .classes { display:flex; height:16px; margin-top:43px; gap:4px; }
    .classes i { flex:1; border-radius:8px 0 0 8px; background:var(--purple); }
    .classes i:nth-child(2) { border-radius:0; background:#684fed; }
    .classes i:nth-child(3) { border-radius:0; background:#755df1; }
    .classes i:nth-child(4) { border-radius:0 8px 8px 0; background:#866ff4; }
    tbody tr:hover td { background:#131b28; }
    td { height:94px; background:#0f1622; font-size:16px; }
    .truncate { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .json-cell { display:flex; gap:10px; align-items:center; }
    .json-cell .truncate { flex:1; }
    .expand { flex:none; width:38px; height:38px; border:1px solid #3a475b; border-radius:50%; background:#172232; color:#dce4ef; font:14px ui-monospace; cursor:pointer; }
    .empty { padding:80px; color:var(--muted); text-align:center; }
    .pager { display:flex; align-items:center; justify-content:center; gap:14px; min-height:70px; background:#0c121d; font-family:system-ui,sans-serif; }
    .page { min-width:39px; height:39px; border:0; border-radius:9px; background:transparent; color:#cfd6e0; font-size:17px; cursor:pointer; }
    .page.active { background:#171e2d; color:var(--orange); font-weight:800; }
    .page:disabled { opacity:.35; cursor:not-allowed; }
    .status { margin-left:auto; color:var(--muted); font:13px system-ui,sans-serif; }
    dialog { width:min(900px,calc(100% - 30px)); max-height:80vh; padding:0; border:1px solid #354259; border-radius:14px; background:#0e1521; color:var(--text); box-shadow:0 30px 100px #000; }
    dialog::backdrop { background:rgba(0,0,0,.72); }
    .modal-head { display:flex; align-items:center; padding:17px 20px; border-bottom:1px solid var(--line); font:700 18px system-ui,sans-serif; }
    .modal-head button { margin-left:auto; border:0; background:transparent; color:white; font-size:24px; cursor:pointer; }
    pre { margin:0; padding:20px; overflow:auto; max-height:65vh; white-space:pre-wrap; overflow-wrap:anywhere; color:#d9e3f0; font-size:13px; }
    @media(max-width:800px) { main{width:100%;margin:0}.viewer{border-radius:0}.converted,.button.hide-small{display:none}.selectors{grid-template-columns:1fr}.selector:first-child{border-right:0;border-bottom:1px solid var(--line)} }
  </style>
</head>
<body>
<main>
  <section class="viewer">
    <header class="topbar">
      <span class="logo">▦</span><h1>Dataset Viewer</h1><span class="spacer"></span>
      <span class="converted">↻&nbsp; Local JSONL viewer</span>
      <a class="button hide-small" href="yettel_dataset_creation_and_sample.html">Overview</a>
      <a class="button purple" href="yettel_dataset_creation_and_sample.pdf">PDF</a>
    </header>
    <div class="selectors">
      <div class="selector"><label>Subset (2)</label><select id="subset"><option value="qa">MultiHopRAG · 2.56k rows</option><option value="corpus">Corpus · 340 rows</option></select><span class="chevron"></span></div>
      <div class="selector"><label>Split (1)</label><select><option>train · full dataset</option></select><span class="chevron"></span></div>
    </div>
    <div class="search"><span class="glass"></span><input id="search" placeholder="Search this dataset"><span class="status" id="status">Loading records…</span></div>
    <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"><tr><td class="empty">Loading the Yettel dataset…</td></tr></tbody></table></div>
    <nav class="pager" id="pager"></nav>
  </section>
</main>
<dialog id="modal"><div class="modal-head"><span id="modalTitle">Record details</span><button onclick="modal.close()">×</button></div><pre id="modalText"></pre></dialog>
<script>
  const paths={qa:'../data/processed/yettel_bg/questions.jsonl',corpus:'../data/processed/yettel_bg/documents.jsonl'};
  const configs={
    qa:{cols:[
      {key:'query',name:'query',type:'string · lengths',width:'34%',visual:'hist'},
      {key:'evidence_list',name:'evidence_list',type:'list',width:'34%',visual:'hist',json:true},
      {key:'question_type',name:'question_type',type:'string · classes',width:'15%',visual:'classes'},
      {key:'answer',name:'answer',type:'string · lengths',width:'17%',visual:'hist'}]},
    corpus:{cols:[
      {key:'title',name:'title',type:'string · lengths',width:'25%',visual:'hist'},
      {key:'body',name:'body',type:'string · lengths',width:'39%',visual:'hist'},
      {key:'category',name:'category',type:'string · classes',width:'13%',visual:'classes'},
      {key:'url',name:'url',type:'string',width:'23%',visual:'hist'}]}
  };
  const state={subset:'qa',all:[],filtered:[],page:1,size:10};
  const $=id=>document.getElementById(id);
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function bars(){return '<div class="hist">'+[10,20,44,55,39,18,8,4,3].map(h=>`<i style="height:${h}px"></i>`).join('')+'</div>'}
  function header(){const cols=configs[state.subset].cols;$('thead').innerHTML='<tr>'+cols.map(c=>`<th style="width:${c.width}"><span class="name">${c.name}</span><span class="dtype">${c.type.includes(' · ')?c.type.replace(' · ',' · <i>')+'</i>':c.type}</span>${c.visual==='classes'?'<div class="classes"><i></i><i></i><i></i><i></i></div>':bars()}</th>`).join('')+'</tr>'}
  function display(v){if(Array.isArray(v)||v&&typeof v==='object')return JSON.stringify(v);return String(v??'')}
  function rows(){const cols=configs[state.subset].cols,start=(state.page-1)*state.size,items=state.filtered.slice(start,start+state.size);if(!items.length){$('tbody').innerHTML=`<tr><td colspan="${cols.length}" class="empty">No matching records</td></tr>`;return}$('tbody').innerHTML=items.map((row,ri)=>'<tr>'+cols.map(c=>{const value=display(row[c.key]);if(c.json)return `<td><div class="json-cell"><div class="truncate">${escapeHtml(value)}</div><button class="expand" data-index="${start+ri}" data-key="${c.key}">{…}</button></div></td>`;return `<td><div class="truncate">${escapeHtml(value)}</div></td>`}).join('')+'</tr>').join('');document.querySelectorAll('.expand').forEach(b=>b.onclick=()=>showDetail(+b.dataset.index,b.dataset.key))}
  function pages(){const total=Math.max(1,Math.ceil(state.filtered.length/state.size)),current=state.page,nums=[1,current-1,current,current+1,total].filter((v,i,a)=>v>=1&&v<=total&&a.indexOf(v)===i).sort((a,b)=>a-b);let last=0,html=`<button class="page" data-p="${current-1}" ${current===1?'disabled':''}>‹ Previous</button>`;for(const n of nums){if(last&&n-last>1)html+='<span>…</span>';html+=`<button class="page ${n===current?'active':''}" data-p="${n}">${n}</button>`;last=n}html+=`<button class="page" data-p="${current+1}" ${current===total?'disabled':''}>Next ›</button>`;$('pager').innerHTML=html;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(!b.disabled){state.page=+b.dataset.p;render()}})}
  function render(){header();rows();pages();$('status').textContent=`${state.filtered.length.toLocaleString()} rows`}
  function filter(){const q=$('search').value.trim().toLocaleLowerCase();state.filtered=q?state.all.filter(r=>JSON.stringify(r).toLocaleLowerCase().includes(q)):state.all;state.page=1;render()}
  function showDetail(index,key){const row=state.filtered[index],value=row[key];$('modalTitle').textContent=key;$('modalText').textContent=JSON.stringify(value,null,2);$('modal').showModal()}
  async function load(subset){state.subset=subset;$('status').textContent='Loading records…';$('tbody').innerHTML='<tr><td class="empty">Loading the Yettel dataset…</td></tr>';try{const text=await fetch(paths[subset]).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});state.all=text.trim().split(/\n+/).map(JSON.parse);state.filtered=state.all;state.page=1;$('search').value='';render()}catch(e){$('tbody').innerHTML='<tr><td class="empty">Could not load the local JSONL file. Open this page through the provided localhost link.</td></tr>';$('status').textContent='Load error'}}
  $('subset').addEventListener('change',e=>load(e.target.value));$('search').addEventListener('input',filter);load('qa');
</script>
</body>
</html>
