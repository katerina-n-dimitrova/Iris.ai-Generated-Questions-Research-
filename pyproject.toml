[project]
name = "context-enrichment-rag"
version = "0.1.0"
description = "Context enrichment for RAG retrieval: adaptive generated-question indexing on MultiHop-RAG and Yettel Bulgaria"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "tiktoken>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed when EMBEDDING_BACKEND=huggingface; the presentation runs use iris.
hf = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
