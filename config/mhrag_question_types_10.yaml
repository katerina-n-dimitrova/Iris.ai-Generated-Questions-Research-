random_seed: 42
source_experiment: mhrag_atomic_chunk_mix_10
questions_per_type_per_chunk: 6
question_types: [atomic, relation, causal, temporal, comparison, compositional, broad]
generation:
  maximum_retries: 3
  temperature: 0.2
  workers: 6
filtering:
  near_duplicate_cosine: 0.93
  roundtrip_parent_top_k: 10
retrieval:
  top_k_values: [1, 3, 4, 5, 10]
  rank_depth: 10
  candidate_multiplier: 10
  similarity_metric: cosine
evaluation:
  bootstrap_resamples: 1000
chromadb:
  namespace: mhrag_question_types_10

