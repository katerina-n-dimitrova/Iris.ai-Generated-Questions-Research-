# =====================================================================
# MultiHop-RAG — 15-article, dense-VECTOR-SEARCH-ONLY pilot
# Condition A: original-chunk vectors   vs.   Condition B: 10 generated
# questions per chunk (mapped back to parent chunk). ChromaDB (local).
#
# NO BM25 / keyword / sparse / hybrid / RRF. Dense cosine similarity only.
# Credentials are NOT stored here — they come from the project .env
# (OPENAI_API_KEY, EMBEDDING_BACKEND / HF_EMBEDDING_MODEL).
# =====================================================================

random_seed: 42

dataset:
  name: "yixuantt/MultiHopRAG"
  article_id_field: "url"
  article_count: 15
  use_only_fully_covered_queries: true
  include_null_questions: false

chunking:
  chunk_size_tokens: 512
  chunk_overlap_tokens: 128
  minimum_chunk_tokens: 80
  tokenizer: "cl100k_base"      # tiktoken encoding used for token windows

question_generation:
  questions_per_chunk: 10
  maximum_retries: 3
  near_duplicate_threshold: 0.92   # SequenceMatcher ratio => drop as near-dup
  cache_results: true

retrieval:
  top_k_values: [1, 3, 4, 5, 10]
  rank_depth: 10                          # ranked chunks stored per query
  generated_question_candidate_multiplier: 10   # >=10x so 10+ unique parents survive dedup
  similarity_metric: "cosine"
  parent_chunk_score_method: "max"        # chunk score = max over its questions

answer_generation:
  top_k: 5
  enabled: true

evaluation:
  bootstrap_resamples: 1000

chromadb:
  mode: "local"                 # dedicated local PersistentClient (no cloud keys)
  namespace: "mhrag_vectoronly"
  baseline_collection: "mhrag_vo_baseline_chunks"
  generated_question_collection: "mhrag_vo_generated_questions"

models:
  # Resolved from .env at runtime; recorded here for provenance only.
  embedding_model: "env:HF_EMBEDDING_MODEL"         # Octen/Octen-Embedding-0.6B
  question_generation_model: "env:OPENAI_CHAT_MODEL" # gpt-4o-mini
  answer_generation_model: "env:OPENAI_CHAT_MODEL"   # gpt-4o-mini
  generation_temperature: 0.3
